<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Money Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans pb-16">
    <div class="p-4 bg-slate-800 m-4 rounded-xl shadow-lg flex justify-between items-center">
        <div>
            <p class="text-xs text-slate-400">আপনার ব্যালেন্স</p>
            <h2 class="text-2xl font-bold text-orange-400" id="user-balance">৳10</h2>
        </div>
        <button onclick="requestWithdraw()" class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded-lg font-semibold text-sm">উইথড্র</button>
    </div>
    <div class="p-4 space-y-3">
        <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
            <div>
                <h3 class="font-bold">Watch and get reward</h3>
                <p class="text-xs text-slate-400">৳10 আর্ন করুন</p>
            </div>
            <button onclick="watchAd()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-bold">শুরু করুন</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function watchAd() {
            // Replace with your Monetag script link or trigger
            window.open("https://your-monetag-smartlink-url.com", "_blank");
            let currentBalance = 10;
            document.getElementById('user-balance').innerText = `৳${currentBalance + 10}`;
            alert("Task completed! Reward added.");
        }
        function requestWithdraw() {
            tg.showAlert("Withdrawal requests are processed within 24 hours.");
        }
    </script>
</body>
</html>
